[project]
name = "airshield-purposegraph-service"
version = "0.1.0"
description = "Deterministic PurposeGraph trust-layer engine (production mirror)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
