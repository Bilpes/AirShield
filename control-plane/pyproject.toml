[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airshield-control-plane"
version = "1.0.0"
description = "Audit-ready PII/PHI/PCI privacy control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "uvicorn[standard]==0.52.4",
  "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0",
  "alembic==1.16.5",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "cryptography==50.0.0",
  "httpx==0.28.1",
  "azure-identity==1.24.0",
  "azure-keyvault-keys==4.11.0",
  "structlog==25.4.0",
  "prometheus-client==0.22.1",
  "presidio-analyzer==2.2.364",
  "spacy==3.8.15",
  "PyYAML==6.0.3",
  "tenacity==9.1.4"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "aiosqlite==0.21.0",
  "ruff==0.12.9",
  "mypy==1.17.1",
  "types-PyYAML==6.0.12.20250822",
  # Edge route import/integration tests; not required by the control-plane runtime.
  "python-multipart==0.0.32",
  "pip-audit==2.9.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "migrations*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
