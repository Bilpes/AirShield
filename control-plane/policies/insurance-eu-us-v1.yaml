id: insurance-eu-us-v1
version: "1.0.0"
language: en
mapping_ttl_minutes: 720
raw_buffer_ttl_seconds: 30
review_below_threshold: true
legal_tags: [GDPR, HIPAA-when-applicable, PCI-DSS-4.0.1]
allowed_destinations: [claims-local, claims-platform, approved-insurance-llm]
entities:
  PERSON: {action: tokenize, threshold: 0.84, critical: true}
  LOCATION: {action: generalize, threshold: 0.82, critical: false}
  DATE_TIME: {action: tokenize, threshold: 0.88, critical: false}
  CARD_OR_ACCOUNT: {action: tokenize, threshold: 0.92, critical: true}
  PHONE: {action: mask, threshold: 0.92, critical: true}
  EMAIL: {action: mask, threshold: 0.95, critical: true}
  ADDRESS: {action: generalize, threshold: 0.88, critical: false}
