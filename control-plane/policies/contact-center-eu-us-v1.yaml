id: contact-center-eu-us-v1
version: "1.0.0"
language: en
mapping_ttl_minutes: 240
raw_buffer_ttl_seconds: 15
review_below_threshold: false
legal_tags: [GDPR, PCI-DSS-4.0.1, NIS2-readiness]
allowed_destinations: [qa-local, agent-assist-local, approved-contact-center-llm]
entities:
  PERSON: {action: tokenize, threshold: 0.84, critical: true}
  CARD_OR_ACCOUNT: {action: tokenize, threshold: 0.92, critical: true}
  PHONE: {action: mask, threshold: 0.92, critical: true}
  EMAIL: {action: mask, threshold: 0.95, critical: true}
  ADDRESS: {action: generalize, threshold: 0.88, critical: false}
  DATE_TIME: {action: tokenize, threshold: 0.90, critical: false}
  SECRET: {action: redact, threshold: 0.95, critical: true}
