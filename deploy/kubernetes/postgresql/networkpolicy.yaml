apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: airshield-postgresql, namespace: airshield}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: airshield-postgresql}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [airshield-control-plane, airshield-retention]}
      ports:
        - {protocol: TCP, port: 5432}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
