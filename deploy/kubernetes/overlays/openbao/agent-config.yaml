apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-agent
  namespace: airshield
data:
  agent.hcl: |
    pid_file = "/tmp/agent.pid"
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = { role = "airshield-control-plane" }
      }
      sink "file" {
        config = { path = "/var/run/secrets/openbao/token" }
      }
    }
    vault { address = "https://openbao.airshield.svc.cluster.local:8200" }
