apiVersion: v1
kind: ConfigMap
metadata:
  name: airshield-control-plane
  namespace: airshield
data:
  KEY_PROVIDER: openbao
  OPENBAO_ADDR: https://openbao.airshield.svc.cluster.local:8200
  OPENBAO_TOKEN_FILE: /var/run/secrets/openbao/token
  OPENBAO_TRANSIT_MOUNT: transit
  OPENBAO_WRAP_KEY: airshield-wrap
  OPENBAO_SIGN_KEY: airshield-sign
  WORKLOAD_BINDINGS_JSON: >-
    {"system:serviceaccount:airshield:airshield-web":{"tenant_id":"REPLACE_TENANT_ID","scopes":["airshield.protect"]},"system:serviceaccount:airshield:airshield-edge":{"tenant_id":"REPLACE_TENANT_ID","scopes":["airshield.protect","airshield.bind"]}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airshield-control-plane
  namespace: airshield
spec:
  template:
    spec:
      containers:
        - name: control-plane
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: openbao-token, mountPath: /var/run/secrets/openbao, readOnly: true}
        - name: openbao-agent
          image: openbao/openbao@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
          args: [agent, -config=/etc/openbao/agent.hcl]
          env:
            - {name: HOME, value: /tmp}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: openbao-config, mountPath: /etc/openbao, readOnly: true}
            - {name: openbao-token, mountPath: /var/run/secrets/openbao}
            - {name: openbao-kubernetes-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: agent-tmp, mountPath: /tmp}
      volumes:
        - name: openbao-config
          configMap: {name: openbao-agent}
        - name: openbao-token
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: agent-tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: openbao-kubernetes-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openbao
                  expirationSeconds: 900
