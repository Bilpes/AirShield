apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: airshield-gateway-secrets
  namespace: airshield
spec:
  provider: azure
  secretObjects:
    - secretName: airshield-edge-gateway
      type: Opaque
      data:
        - {objectName: edge-gateway-shared-secret, key: current}
        - {objectName: edge-gateway-previous-secret, key: previous}
  parameters:
    usePodIdentity: "false"
    clientID: REPLACE_GATEWAY_MANAGED_IDENTITY_CLIENT_ID
    keyvaultName: REPLACE_GATEWAY_KEY_VAULT_NAME
    tenantId: REPLACE_ENTRA_TENANT_ID
    objects: |
      array:
        - |
          objectName: edge-gateway-shared-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: edge-gateway-previous-secret
          objectType: secret
          objectVersion: ""
