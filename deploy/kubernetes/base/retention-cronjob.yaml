apiVersion: batch/v1
kind: CronJob
metadata:
  name: airshield-retention
  namespace: airshield
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: airshield-retention}
        spec:
          restartPolicy: Never
          serviceAccountName: airshield-control-plane
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: retention
              image: ghcr.io/example/airshield-control-plane@sha256:REPLACE_WITH_SIGNED_IMAGE_DIGEST
              command: [python, -m, app.retention]
              envFrom:
                - configMapRef: {name: airshield-control-plane}
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: airshield-database, key: url}
                - name: TOKEN_INDEX_KEY_B64
                  valueFrom:
                    secretKeyRef: {name: airshield-index-key, key: value}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              volumeMounts:
                - {name: database-ca, mountPath: /var/run/secrets/database, readOnly: true}
          volumes:
            - name: database-ca
              secret:
                secretName: airshield-database-ca
                defaultMode: 0444
                items:
                  - {key: ca.crt, path: ca.crt}
