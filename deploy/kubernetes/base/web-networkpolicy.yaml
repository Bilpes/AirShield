apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: airshield-web, namespace: airshield}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: airshield-web}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {airshield.network/ingress: "true"}
      ports:
        - {protocol: TCP, port: 8443}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: airshield-control-plane}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 11434}
