apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: airshield-control-plane
  namespace: airshield
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: airshield-control-plane}
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: 75}
