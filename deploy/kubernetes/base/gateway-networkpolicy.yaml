apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: airshield-gateway-ingress
  namespace: airshield
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: airshield-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              airshield.network/ingress: "true"
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: airshield-gateway-egress
  namespace: airshield
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: airshield-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: airshield-edge
      ports:
        - {protocol: TCP, port: 8001}
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - {protocol: TCP, port: 443}
