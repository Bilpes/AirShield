apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: airshield-edge, namespace: airshield}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: airshield-edge}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: airshield-gateway}
      ports:
        - {protocol: TCP, port: 8001}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: airshield-control-plane}
      ports:
        - {protocol: TCP, port: 8080}
