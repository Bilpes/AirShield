apiVersion: apps/v1
kind: Deployment
metadata:
  name: airshield-gateway
  namespace: airshield
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: airshield-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airshield-gateway
        app.kubernetes.io/part-of: airshield
    spec:
      serviceAccountName: airshield-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: REPLACE_REGISTRY/airshield-gateway@sha256:REPLACE_SIGNED_DIGEST
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args:
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ssl-certfile
            - /var/run/secrets/gateway-tls/tls.crt
            - --ssl-keyfile
            - /var/run/secrets/gateway-tls/tls.key
            - --no-proxy-headers
          envFrom:
            - configMapRef: {name: airshield-gateway-config}
          env:
            - name: EDGE_GATEWAY_SECRET
              valueFrom:
                secretKeyRef: {name: airshield-edge-gateway, key: current}
          ports:
            - {name: https, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: edge-tls, mountPath: /var/run/secrets/edge-tls, readOnly: true}
            - {name: gateway-tls, mountPath: /var/run/secrets/gateway-tls, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: edge-tls
          secret:
            secretName: airshield-edge-tls
            defaultMode: 0444
            items:
              - {key: ca.crt, path: ca.crt}
        - name: gateway-tls
          secret:
            secretName: airshield-gateway-tls
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: airshield-gateway
