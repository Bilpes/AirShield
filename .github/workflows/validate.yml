name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    env:
      ENVIRONMENT: test
      AUTH_MODE: dev
      KEY_PROVIDER: local
      FAIL_CLOSED: "true"
      LOCAL_MASTER_KEY_B64: bW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW0=
      LOCAL_SIGNING_PRIVATE_KEY_B64: c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
      TOKEN_INDEX_KEY_B64: aWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWk=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: control-plane/pyproject.toml}
      - run: pip install -e '.[dev]'
      - run: pip-audit --local
      - run: pip-audit -r ../edge-service/requirements.txt
      - run: ruff format --check app tests migrations evaluation scripts
      - run: ruff check app tests migrations evaluation scripts
      - run: mypy app scripts
      - run: python -m compileall -q app migrations evaluation scripts
      - run: pytest -q
      - run: ruff format --check --config pyproject.toml ../edge-service/app ../edge-service/tests
      - run: ruff check --config pyproject.toml ../edge-service/app ../edge-service/tests
      - run: MYPYPATH=../edge-service mypy --ignore-missing-imports ../edge-service/app
      - run: cd ../edge-service && PYTHONPATH=. pytest -q tests
      - run: ruff format --check --config ../gateway-service/pyproject.toml ../gateway-service/app ../gateway-service/tests
      - run: ruff check --config ../gateway-service/pyproject.toml ../gateway-service/app ../gateway-service/tests
      - run: MYPYPATH=../gateway-service mypy --ignore-missing-imports ../gateway-service/app
      - run: cd ../gateway-service && PYTHONPATH=. pytest -q tests
      - run: python evaluation/evaluate.py evaluation/fixtures/regex-gate.jsonl --require-perfect
      - run: alembic upgrade head --sql > /tmp/migration.sql
      - run: python scripts/export_openapi.py && git diff --exit-code ../api/openapi.yaml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
      - run: kubectl kustomize deploy/kubernetes/base > /tmp/base.yaml
      - run: kubectl kustomize deploy/kubernetes/overlays/azure > /tmp/azure.yaml
      - run: kubectl kustomize deploy/kubernetes/overlays/openbao > /tmp/openbao.yaml
      - uses: azure/cli@d4515bc8e518874d3c814bf5c307a1cb08ec9b35 # v2
        with:
          inlineScript: az bicep build --file deploy/azure/main.bicep
